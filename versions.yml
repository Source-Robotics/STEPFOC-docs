# The version facts of this documentation, in ONE place (the same system as Source-Robotics/par6).
#
# Edit them here, never in a page. hooks/versions.py writes them into the manual's version box
# (<!-- doc-meta: KEY --> on its landing page) and into the list of documents (<!-- documents-table -->), and the
# publishing workflow reads docs_version. README.md, "Versions and releases", says when to change what.

# The documentation version: the STEPFOC firmware release these pages describe. The publishing workflow publishes
# the site under this name (the version selector in the header) and points "latest" at it. Older firmware releases
# keep their own version of the site.
docs_version: "103"

# The firmware release the pages describe, and the generated pages come from. Its tag must be V<docs_version>.
# Releases are cut from the bootloader-version branch (see the firmware repository's release_guide.md); V103 was
# the last release from main.
firmware:
  repository: https://github.com/Source-Robotics/STEPFOC-stepper-controller
  tag: V103

# One entry per document. revision: YEAR.LETTER, a new letter for every published revision of that document.
# status: draft until the document is published; published: the date of the revision's publication, or null.
# firmware: true for a document that describes one firmware release (docs_version) and shows it in its version box.
manuals:
  stepfoc:
    number: SR-5001
    title: STEPFOC Manual
    revision: 2026.A
    status: published
    published: 2026-10-29
    firmware: true
    applies_to: STEPFOC driver PCB v1
    covers: "the STEPFOC stepper driver: datasheet, setup, calibration, tuning, the CAN and UART interfaces, guides"
