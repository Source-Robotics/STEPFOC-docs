# Which firmware release works with what. One row per firmware release, newest first. hooks/firmware_pages.py
# writes it into the "Versions and compatibility" page (<!-- compatibility-table -->); tools/test_tools.py checks
# that docs_version has a row. The firmware repository has no compatibility file of its own, so this is the source.
# The Motor GUI column was added with 110; it is empty for the releases before.
columns:
  - {key: firmware, title: Firmware}
  - {key: date, title: Released}
  - {key: bootloader, title: Bootloader}
  - {key: spectral, title: Spectral Micro equivalent}
  - {key: python, title: Python library (Spectral-BLDC)}
  - {key: motor_gui, title: Motor GUI}
  - {key: runtime, title: PAR6 runtime}
  - {key: pcb, title: STEPFOC PCB}
  - {key: docs, title: Docs}

rows:
  - firmware: "110"
    date: 2026-11-13
    bootloader: required
    spectral: "110"
    python: "1.22 or newer (names for parameters 90 to 93; 1.21 reads them by their numbers)"
    motor_gui: "0.7.0 or newer (STOP sends #Estop over UART, presets write parameters 90 to 92 over CAN)"
    runtime: 0.9 or newer (it sends watchdog action 0, the legacy response)
    pcb: v1
    docs: "110"
  - firmware: "109"
    date: 2026-11-10
    bootloader: required
    spectral: "109 (from 109 the two share their version numbers; there is no Spectral Micro 108)"
    python: "1.21 or newer (the calls for the commands added in 109: parameters, identity, telemetry, buffers, the watchdog's coast and descend)"
    motor_gui: 0.5.0 or newer
    runtime: 0.9 or newer (it sends watchdog action 0, the legacy response)
    pcb: v1
    docs: "109"
  - firmware: "108"
    date: 2026-08-26
    bootloader: required (installed on boards shipped with 105 or newer, and on some shipped before)
    spectral: "107"
    python: 1.20 or newer
    runtime: 0.9 or newer
    pcb: v1
    docs: "108"
  - firmware: "107"
    date: 2026-08-24
    bootloader: required
    spectral: 107, without its calibration fix (which came with STEPFOC 108)
    python: 1.20 or newer
    runtime: 0.9 or newer
    pcb: v1
    docs: not published
  - firmware: "106"
    date: 2026-07-05
    bootloader: required
    spectral: "106"
    python: 1.19 or newer
    runtime: 0.9 or newer
    pcb: v1
    docs: not published
  - firmware: "105"
    date: 2026-07-04
    bootloader: required (the first release that needs it)
    spectral: "105"
    python: 1.19 or newer
    runtime: 0.9 or newer
    pcb: v1
    docs: not published
  - firmware: "103"
    date: 2025-12-28
    bootloader: none (flashed with a programming adapter)
    spectral: "101"
    python: 1.17 or newer
    runtime: 0.9 or newer
    pcb: v1
    docs: "103"
