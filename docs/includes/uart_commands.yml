# The hand-written half of the UART reference: what each command is for, its argument and what the response means.
# The other half (which commands exist, Set/Get or action, the argument type, the mode a command enters, what it
# prints) comes from the firmware at its release tag (generated/firmware_facts.json), and the build fails when the
# two disagree. Keys are the command names exactly as the firmware compares them (case matters).

groups:
  motion:
    title: Motion
    page: motion.md
  gains:
    title: Gains and limits
    page: gains.md
  calibration:
    title: Calibration and motor parameters
    page: calibration.md
  utility:
    title: Status and utility
    page: utility.md
  gripper:
    title: Gripper
    page: gripper.md

commands:
  # ------------------------------------------------------------ motion
  Iq: {group: motion, argument: current setpoint in mA, description: Current (torque) control with the given Iq setpoint., response: the measured Iq in mA}
  Id: {group: motion, argument: current setpoint in mA, description: "Sets the Id setpoint; normally left at 0. Also parameter 58.", response: the measured Id in mA}
  V: {group: motion, argument: speed setpoint in encoder ticks/s, description: Velocity control with the given speed., response: the measured speed in ticks/s}
  P: {group: motion, argument: position setpoint in encoder ticks, description: Position control to the given position., response: the measured position in ticks}
  PD: {group: motion, argument: position setpoint in encoder ticks, description: Impedance (PD) control around the given position with the gains KP and KD., response: the measured position in ticks}
  PDV: {group: motion, argument: speed setpoint in encoder ticks/s, description: The speed setpoint of the PD loop., response: the PD speed setpoint}
  PDI: {group: motion, argument: current feedforward in mA, description: The current feedforward of the PD loop., response: the PD current feedforward}
  Uq: {group: motion, argument: voltage in mV, description: Voltage-torque mode with the given q-axis voltage (no current loop)., response: the Uq setpoint in mV}
  Ud: {group: motion, argument: voltage in mV, description: The d-axis voltage used in voltage-torque mode; does not change the mode., response: the Ud setpoint in mV}
  Openloop: {group: motion, argument: electrical speed in rad/s, description: "Spins the motor open loop, as a plain stepper, with the voltage set by Openv. The voltage is not current-controlled and Ilim does not apply: see Open-loop stepping on Control modes.", response: the open-loop speed}
  gosteps: {group: motion, argument: number of microsteps (sign = direction), description: "Moves the given number of microsteps open loop, one every stepinterval, at the voltage set by Openv, then goes to idle. With microstep 16, 16 steps are one electrical cycle: four full steps, 7.2° on a 1.8° motor.", response: "`Moving for N steps`"}
  stepinterval: {group: motion, argument: step time in µs, description: "The time between two microsteps of gosteps, 1000 µs by default. It is rounded down to whole control cycles of 160 µs, and is 160 µs at the least.", response: the step interval}
  microstep: {group: motion, argument: microsteps per electrical cycle, description: "The microsteps gosteps makes per electrical cycle (four full steps), 16 by default.", response: the microstep setting}
  HALL: {group: motion, description: "Homing against the sensor on ADDITIONAL2 at 3000 ticks/s, triggered when the pin is low. It holds while the pin stays low and spins on when the pin goes high again (see Send_data_pack_HALL for the CAN form with a chosen speed and trigger).", response: "`HALL`"}
  Idle: {group: motion, description: Goes to idle; the motor coasts or brakes as set by Brake / Coast., response: "`Idle`"}
  Brake: {group: motion, description: "Goes to idle with the motor braking (phases shorted); also the idle behaviour from then on. Not kept by Save: the driver brakes at every power-up.", response: "`Brake 1`"}
  Coast: {group: motion, description: "Goes to idle with the motor coasting (phases open); also the idle behaviour until the next power-up, which brakes again. Not kept by Save.", response: "`Coast 0`"}
  Close: {group: motion, description: Leaves open loop and goes back to closed-loop idle., response: nothing}

  # ------------------------------------------------------------ gains and limits
  Kpp: {group: gains, argument: gain, description: Kp of the position loop., response: the current value}
  Kpv: {group: gains, argument: gain, description: Kp of the velocity loop., response: the current value}
  Kiv: {group: gains, argument: gain, description: Ki of the velocity loop., response: the current value}
  Kpiq: {group: gains, argument: gain, description: Kp of the Iq current loop; also sets Kpid., response: the current value}
  Kiiq: {group: gains, argument: gain, description: Ki of the Iq current loop; also sets Kiid., response: the current value}
  Kpid: {group: gains, argument: gain, description: Kp of the Id current loop., response: the current value}
  Kiid: {group: gains, argument: gain, description: Ki of the Id current loop., response: the current value}
  KP: {group: gains, argument: gain, description: KP of the impedance (PD) loop., response: the current value}
  KD: {group: gains, argument: gain, description: KD of the impedance (PD) loop., response: the current value}
  Vlimit: {group: gains, argument: speed in encoder ticks/s, description: "The speed limit: it clamps the speed setpoint of the velocity loop, and in position mode the speed the position loop asks for. The velocity integrator is clamped to the current limit (Ilim), not to this. From firmware 109 a negative number counts as its magnitude.", response: the current limit}
  Ilim: {group: gains, argument: current in mA, description: "The Iq current limit, 1700 mA after #Default. Set it to the rated phase current of your motor; this command clamps it to 2800 mA and takes the magnitude of a negative number (from firmware 109 Send_Limits over CAN stops at 2800 mA too). Calibration uses 1600 mA for its steps and, from firmware 109, puts it back when it ends.", response: the current limit}
  Vlim: {group: gains, argument: voltage in mV, description: "The voltage limit of the current loops (Ud and Uq), 6000 mV by default. It keeps the loops of low-resistance steppers stable, and it also caps the top speed. 0, or a value above the supply voltage, means the supply voltage.", response: the current limit in mV}
  Rstint: {group: gains, argument: 0 or 1, description: Whether the integral accumulators are reset on every new setpoint., response: the setting}
  Cbw: {group: gains, argument: "bandwidth in Hz, 10 to 625", description: "The current loop bandwidth. From firmware 109 setting it computes Kpiq and Kiiq at once from R and L, the way calibration does, and prints them (the same as parameter 49); a value outside 10-625, or with R or L at 0, changes nothing. Not kept by Save: 160 Hz at every power-up, but the gains it set are kept.", response: "the bandwidth, then `Kp_iq = …, Ki_iq = …`"}

  # ------------------------------------------------------------ calibration and motor parameters
  Cal: {group: calibration, description: "Runs the calibration routine (see Motor parameters and calibration), over the serial port only. Enter R, L and PP first, and the current limit for the motor: it uses its own 1600 mA for its steps and puts the limit back when it ends (firmware 108 and older left 1600 mA). From firmware 109, when it succeeds, the encoder table and then the anti-cogging with the current-sense trim follow by themselves, and everything is saved (about a minute; keep the shaft free).", response: the calibration log}
  Calonly: {group: calibration, description: "The calibration alone: like Cal, but nothing follows it. Save afterwards with Save. Added in firmware 109.", response: the calibration log}
  Calangle: {group: calibration, description: "Runs only an angle-offset search. It uses an older routine than the one in Cal, which gives up after about two minutes and keeps the offset it reached. Prints `Idle` at once, before the search starts. From firmware 109, when parameter 56 is not 0, the anti-cogging is identified again afterwards (with the current-sense trim) and everything is saved: the anti-cogging depends on the offset. After a timeout nothing follows and nothing is saved. From firmware 109 it is refused while the driver is in error.", response: "`Idle`, at once; `Calangle: not started, the drive is in error (#Error, #Clear)` when it is refused"}
  Encal: {group: calibration, argument: "nothing, or save, all, stop, on, off, state", description: "The encoder table (see Encoder table and anti-cogging). Alone it measures the table and uses it: the field turns the rotor open loop one shaft turn each way at 2048 ticks/s, about 20 s, with the shaft free. `save` also saves; `all` then identifies the anti-cogging and saves both; `stop` aborts; `on` and `off` switch the correction (on only with a measured table, and neither while a run turns the motor); `state`, or any other word, only prints. The same as parameters 52 and 53. Added in firmware 109.", response: "`Encoder table: <state>`, then the table's error in degrees"}
  Cogcal: {group: calibration, argument: "nothing, or save, trim, stop, state", description: "The anti-cogging identification on the drive (see Encoder table and anti-cogging): one motor turn forward and one back in velocity mode at parameter 44's speed (1500 ticks/s, about 22 s), the shaft free to turn. `save` also saves; `trim` first corrects the current-sense zeros from the result and identifies again (not saved: parameter 43 = 5 trims and saves); `stop` aborts, also the encoder part of a combined run; `state`, or any other word, only prints. States 10 and 11 print their own text; 7 and 8, the encoder part of a combined run, show only in parameter 43. Added in firmware 109.", response: "`Anti-cogging identification: <state>`, the speed and the identified cogging in mA rms, and the harmonics when done"}
  R: {group: calibration, argument: resistance in Ω, description: "The phase resistance of the motor (one coil). STEPFOC does not measure it; enter the datasheet value before Cal. Also parameter 76, in mΩ.", response: the current value}
  L: {group: calibration, argument: inductance in H, description: "The phase inductance of the motor (one coil); enter the datasheet value before Cal. Also parameter 77, in µH.", response: the current value}
  PP: {group: calibration, argument: pole pairs, description: "The motor's pole pairs: 50 for a 1.8° stepper, 75 for 1.2°, 100 for 0.9°, 125 for 0.72°. Calibration accepts only these values. Also parameter 78: 1-200, only while idle; from 109 `#PP` answers `PP: not taken (1-200, and only while idle)` otherwise.", response: the current value}
  Kt: {group: calibration, argument: Nm/A, description: "The torque constant, found by calibration.", response: the current value}
  KV: {group: calibration, argument: rpm/V, description: "The velocity constant, found by calibration.", response: the current value}
  Flux: {group: calibration, argument: Wb, description: "The flux linkage, found by calibration. Works over UART from firmware 109; the parser of 108 and older accepted only the lowercase `#flux`, which had no handler.", response: the current value}
  Offset: {group: calibration, argument: angle in rad, description: "The angle offset between encoder zero and electrical zero, found by calibration.", response: the current value}
  Iqoffset: {group: calibration, argument: current in mA, description: The current used by the angle-offset search., response: the current value}
  Magnet: {group: calibration, description: Reads the encoder's magnet status., response: "`Magnet Good` or `Magnet Bad`"}
  Dir: {group: calibration, argument: 0 or 1, description: "A stored flag that Info prints as `Phase direction`. The control code does not use it in this release; #Default writes 0.", response: the current value}
  Phase: {group: calibration, description: Prints the phase order found by calibration., response: "`Phase order is: N`"}
  Resv: {group: calibration, argument: voltage in mV, description: "The voltage calibration starts the resistance test at (not used by STEPFOC, which does not measure resistance).", response: the current value}
  Calpwr: {group: calibration, argument: power in W, description: The power calibration may dissipate in the resistance and inductance tests (not used by STEPFOC)., response: the current value}
  Openv: {group: calibration, argument: voltage in mV, description: "The voltage of the open-loop modes (Openloop, gosteps), 5000 mV at power-up. Calibration does not use it: its open-loop spin has a fixed 5000 mV. Not kept by Save.", response: the current value}
  Opens: {group: calibration, argument: electrical speed in rad/s, description: "The electrical speed of Openloop, the same value Openloop sets. Calibration does not use it.", response: the current value}
  Vp: {group: calibration, argument: voltage in mV, description: "Stored, but not used by this firmware: the phase-order check of calibration uses a fixed 3000 mV.", response: the current value}
  Calibrated: {group: calibration, argument: 0 or 1, description: "The calibrated flag. `#Calibrated 1` clears a calibration error without calibrating; the motor may still be uncalibrated.", response: the flag}

  # ------------------------------------------------------------ status and utility
  Save: {group: utility, description: "Writes the configuration to the EEPROM, and the CAN ID into the bootloader's board ID. Do it after calibration and after tuning. It also writes the serial number held in RAM (1 after a power-up, unless SERNUM set it) over the stored one.", response: "`Save`"}
  Reset: {group: utility, description: "Resets the driver. From firmware 105 the reset lands in the bootloader, which waits 2 s for a flashing host and then starts the firmware again.", response: nothing}
  Default: {group: utility, description: "Writes the factory defaults to the EEPROM and loads them: the serial number, hardware version and batch date; the gripper flag, heartbeat, watchdog and thermistor (off); the motor parameters and the calibration (cleared); every gain and limit; from firmware 109 also the tool id (0), the watchdog fallback, the calibration ID (0), the anti-cogging set, the encoder table and its trims (cleared), and parameter 56 (back to 2). From firmware 109 the CAN ID is kept (0 only when no valid one is stored). See Defaults.", response: "`Loaded default config!`"}
  Pullconfig: {group: utility, description: "Prints the whole configuration on one line, for Motor GUI.", response: the configuration}
  Info: {group: utility, description: "Prints the hardware version, batch date and firmware version, the control loop's execution time, the CAN ID, the calibration state, the thermistor and the supply voltage, the phase direction, phase order and commutation direction, and the motor parameters (pole pairs, angle offset, R, L, Kt, KV). From firmware 109 also the build, the board ID and the calibration ID, the CAN receive overruns and dropped transmits, the product, the current-sense zeros, the tool id, the watchdog and its fallback, settings block 2, the anti-cogging, and at the end the `In force:` section (see Status and diagnostics). Not the serial number (SERNUM), the gains (Param) or the errors (Error).", response: the report}
  Tone: {group: utility, argument: "f,mA[,ms], or off", description: "A tone through the motor (see Sound): `#Tone 440,250,1000` plays 440 Hz at a loudness of 250 mA for 1000 ms, on the axis parameter 82 picks. mA left out: 200; ms left out: 500; ms 0: until `#Tone off`. 20 Hz up to below 3125 Hz. It plays only while the driver holds or moves; from idle a calibrated driver first holds the position it is at (`#Idle` releases it). `#Tone` alone or `#Tone off` stops all sound. Added in firmware 109.", response: "`Tone 440 Hz, 250 mA, 1000 ms`; from idle first `Holding the position while it plays (#Idle releases it)`; `Tone: not played (…)` when it cannot; `Tone off`"}
  Par: {group: utility, argument: "n, or n,value", description: "Any parameter by its number (see Parameters and buffers): alone it lists every parameter, `#Par 56` reads one, `#Par 56,0` sets it (no spaces); a gain or limit (8-16, 20) takes a decimal, e.g. `#Par 9,0.02` sets Kpv. Added in firmware 109.", response: "`P<n> = <value>`; `refused: out of range, read only, not now, or unknown` when the driver did not take it; `P<n> unknown`"}
  Tool: {group: utility, argument: 0 to 255, description: "The tool id: what the drive is built into, 0 none, 1 SSG-48, 11-33 MSG (tens = rail 1/2/3 = 100/150/200 mm, units = stepper 1/2/3 = 21.5/40/60 mm), 200-254 your own. The same as parameter 1. Kept by Save. Added in firmware 109.", response: "`Tool ID: N`, or `Invalid tool id (0-255)`"}
  WdFb: {group: utility, argument: "time_ms,current_mA,speed_ticks_s,after_action", description: "The watchdog fallback, four numbers at once without spaces, e.g. `#WdFb 2000,0,1000,2`: how long hold or descend runs, descend's current and speed cap, and what follows (0 legacy, 2 brake, 3 coast). The same as parameters 2 to 5, clamped the same way; fewer than four numbers change nothing. Kept by Save. Added in firmware 109.", response: "`Watchdog fallback: … ms, … mA, … ticks/s, then …`"}
  Product: {group: utility, argument: "nothing, or claim, clear", description: "The product lock: prints this firmware and the board's stamp. `claim` stamps the board as this product (a repaired board, a motor the stamp rule misjudges), `clear` removes the stamp; power-cycle after either. Over UART only. Added in firmware 109.", response: "`Firmware: STEPFOC; board stamp: …`"}
  Param: {group: utility, description: Prints every gain of every loop., response: the gains}
  Help: {group: utility, description: Prints a short command reference. Added in firmware 106., response: the reference}
  Error: {group: utility, description: Prints which errors are active., response: "`No errors!` or `In error state!` followed by one line per active error"}
  Clear: {group: utility, description: "Clears the errors and goes to idle. An error whose cause is still present comes straight back; a calibration error is cleared only by calibrating (or `#Calibrated 1`).", response: "`Clear errors`"}
  Mode: {group: utility, description: "Prints the control mode. The voltage-torque mode prints `Gripper mode`; HALL, the angle-offset search, open-loop steps (gosteps), gripper mode and the encoder-table run print nothing.", response: "`Idle mode`, `Position control`, `Speed control`, `Current control`, `PD control`, `Open loop`, `Gripper mode`, `Gripper calib mode`"}
  Vbus: {group: utility, description: Prints the supply voltage., response: mV}
  Vmax: {group: utility, argument: voltage in mV, description: "The supply voltage above which a Vbus error is raised, 29000 mV after #Default.", response: "`Vmax in mV: N`"}
  Temp: {group: utility, description: Prints the thermistor temperature., response: "°C, or `Temp Off` while the thermistor is disabled"}
  Term: {group: utility, argument: 0 or 1, description: Enables the thermistor measurement and the temperature error (off by default)., response: the setting}
  Tlim: {group: utility, argument: temperature in °C, description: The temperature at which the temperature error is raised; 75 by default., response: "`Temp limit N`"}
  Iabc: {group: utility, description: Prints the phase currents., response: "`Ia`, `Ib` in mA"}
  PWM: {group: utility, description: Prints the PWM duty values., response: the duties}
  LED: {group: utility, argument: 0 or 1, description: Turns the status LED on or off., response: the LED state}
  CANID: {group: utility, argument: 0 to 13, description: "The CAN node ID. Use 0 to 13: the firmware accepts 14 and 15, but the bootloader reserves them and a driver on one of those cannot be updated over CAN. Kept over a power cycle after Save, which also writes it into the bootloader's board ID; from firmware 109 Default and a settings reset keep it too.", response: "the ID, or `Invalid CAN ID`"}
  SERNUM: {group: utility, argument: number, description: "The serial number. This firmware does not read it back from the EEPROM at power-up: it reports 1 until set, and Save writes the value in RAM over the stored one.", response: "`Serial number is: N`"}
  Activate: {group: utility, description: Sets the activated flag., response: "`Controller activated`"}
  Cyc: {group: utility, argument: interval in ms (0 = off), description: "Sends position, speed and Iq on its own every interval: `$ <position> <speed> <Iq>`; for BetterSerialPlotter.", response: "`Cyclic disabled` when turned off"}
  Cyca: {group: utility, argument: interval in ms (0 = off), description: "Like Cyc, in the Arduino plotter format `Position:x,Speed:y,Iq:z`.", response: "`Cyclic disabled` when turned off"}

  # ------------------------------------------------------------ gripper
  Gripper: {group: gripper, argument: 0 or 1, description: "Whether this driver is a gripper. Save it; `#Default` clears it.", response: the flag}
  Gripcal: {group: gripper, description: "Starts the gripper calibration: the jaws find their end stops at 500 mA. It prints nothing when it ends; after about 24 s without both end stops it gives up, uncalibrated. Gripinfo shows the result.", response: "`Gripper calibration!`"}
  Grippos: {group: gripper, argument: 0 (open) to 255 (closed), description: "The position setpoint; also activates the gripper, sets the action bit and goes to gripper mode.", response: the current position}
  Gripvel: {group: gripper, argument: 0 to 255, description: "The speed setpoint of gripper moves, 50 at power-up.", response: the setpoint}
  Gripcur: {group: gripper, argument: current in mA, description: "The current limit of gripper moves, 400 mA at power-up. From firmware 109 a move uses its magnitude, at most the driver's 2800 mA (108 and older used it as sent); see the gripper manual for the safe range.", response: the setpoint}
  Gripact: {group: gripper, argument: 0 or 1, description: The activate bit., response: the bit}
  Gripstop: {group: gripper, argument: 0 or 1, description: "The gripper E-stop bit. While it is 1 the driver raises the gripper E-stop error on every control cycle: set it to 0, then Clear.", response: the bit}
  Gripinfo: {group: gripper, description: "Prints the gripper state: calibrated, activated, end stops, position, current.", response: the report}
